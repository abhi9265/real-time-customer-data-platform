name: Benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      events:
        description: "Synthetic customer events"
        required: true
        default: "100000"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run benchmark
        env:
          BENCHMARK_EVENTS: ${{ inputs.events || '100000' }}
          BENCHMARK_OUT: benchmark-results
        run: python benchmarks/run_benchmark.py
      - name: Publish benchmark summary
        run: |
          echo '## Real-Time customer benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-results/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: realtime-benchmark-${{ inputs.events || '100000' }}-events
          path: benchmark-results/
