name: Data Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,integration]
          pip install ruff

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: pytest

  kafka-smoke:
    name: Kafka to Spark smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,integration]

      - name: Start Kafka
        run: docker compose -f docker-compose.kafka.yml up -d

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              echo "Kafka is accepting connections"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.kafka.yml logs
          exit 1

      - name: Publish deterministic events
        run: python scripts/kafka_producer.py

      - name: Verify Kafka to Spark streaming
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: python scripts/kafka_spark_smoke.py

      - name: Kafka diagnostics
        if: always()
        run: docker compose -f docker-compose.kafka.yml logs --no-color

      - name: Stop Kafka
        if: always()
        run: docker compose -f docker-compose.kafka.yml down -v
